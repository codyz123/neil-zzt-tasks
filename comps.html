<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark Comps — Review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#141B3A;--pink:#D69BC6;--lime:#E3FB61;--sky:#B9E3EA;--cream:#FCFAF1;--white:#fff;--green:#22c55e;--red:#ef4444}
body{font-family:'DM Sans',sans-serif;background:#f8f9fa;color:var(--navy);min-height:100vh}

.header{background:var(--navy);color:var(--white);padding:1.25rem 1.5rem;display:flex;align-items:center;gap:1rem}
.header a{color:rgba(255,255,255,.5);text-decoration:none;font-size:.9rem}
.header a:hover{color:var(--white)}
.header h1{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:1.3rem;flex:1}
.header .badge{background:var(--sky);color:var(--navy);font-family:'Inter Tight',sans-serif;font-weight:700;font-size:.75rem;padding:.25rem .6rem;border-radius:4px}

.request-card{background:var(--white);border:1px solid #e5e7eb;border-radius:12px;padding:1.5rem;margin:1.5rem;max-width:800px;margin-left:auto;margin-right:auto}
.request-card h2{font-family:'Inter Tight',sans-serif;font-weight:800;font-size:1.1rem;margin-bottom:1rem}
.request-meta{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
.meta-tag{background:#f1f5f9;border-radius:6px;padding:.35rem .7rem;font-size:.85rem;font-weight:500}
.meta-tag.urgency-today,.meta-tag.urgency-critical{background:#fef2f2;color:var(--red)}
.meta-tag.urgency-this-week,.meta-tag.urgency-high{background:#fffbeb;color:#d97706}
.request-details{color:#4b5563;font-size:.95rem;line-height:1.6;margin-bottom:.75rem}
.request-goal{color:#6b7280;font-size:.9rem;font-style:italic}

.comps-grid{max-width:800px;margin:0 auto;padding:0 1.5rem 2rem}
.comp-card{
  background:var(--white);border:2px solid #e5e7eb;border-radius:12px;
  padding:1.5rem;margin-bottom:1.25rem;transition:border-color .2s;
}
.comp-card:hover{border-color:var(--navy)}
.comp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.comp-number{
  font-family:'Inter Tight',sans-serif;font-weight:800;font-size:.8rem;
  background:var(--navy);color:var(--white);padding:.25rem .6rem;border-radius:4px;
}
.comp-title{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:1rem;margin-left:.75rem;flex:1}
.comp-content{
  background:#f8f9fa;border-radius:8px;padding:1.25rem;
  font-size:.95rem;line-height:1.7;white-space:pre-wrap;color:#1f2937;
  border:1px solid #e5e7eb;
}
.comp-actions{display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap}
.btn{
  font-family:'Inter Tight',sans-serif;font-weight:700;font-size:.9rem;
  padding:.6rem 1.25rem;border-radius:8px;border:none;cursor:pointer;
  transition:opacity .2s,transform .15s;
}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn-approve{background:var(--green);color:var(--white)}
.btn-edit{background:var(--navy);color:var(--white)}
.btn-reject{background:transparent;color:#9ca3af;border:1px solid #d1d5db}

.edit-area{
  display:none;margin-top:1rem;
}
.edit-area.visible{display:block}
.edit-area textarea{
  width:100%;border:1.5px solid #d1d5db;border-radius:8px;padding:.85rem;
  font-family:'DM Sans',sans-serif;font-size:.95rem;line-height:1.5;
  resize:vertical;min-height:80px;outline:none;color:var(--navy);
}
.edit-area textarea:focus{border-color:var(--navy)}
.edit-area .btn{margin-top:.75rem}

.comp-card.approved{border-color:var(--green);background:#f0fdf4}
.comp-card.approved .comp-number{background:var(--green)}
.comp-card.rejected{opacity:.4}
.approved-label{
  font-family:'Inter Tight',sans-serif;font-weight:700;color:var(--green);
  font-size:.85rem;display:none;
}
.comp-card.approved .approved-label{display:inline}

.status-bar{
  max-width:800px;margin:0 auto;padding:1rem 1.5rem;
  display:none;
}
.status-bar.visible{display:block}
.status-msg{
  background:var(--green);color:var(--white);padding:1rem 1.25rem;
  border-radius:10px;font-family:'Inter Tight',sans-serif;font-weight:700;
  text-align:center;font-size:1rem;
}

.loading{text-align:center;padding:4rem;color:#9ca3af;font-size:1.1rem}

@media(max-width:600px){
  .request-card,.comps-grid{margin-left:.75rem;margin-right:.75rem;padding-left:.75rem;padding-right:.75rem}
  .comp-actions{flex-direction:column}
  .btn{width:100%;text-align:center}
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html">← Tasks</a>
  <h1>Spark Review</h1>
  <span class="badge" id="statusBadge">REVIEW</span>
</div>

<div id="requestSection" class="loading">Loading request...</div>
<div class="comps-grid" id="compsGrid"></div>

<script>
const SUPABASE_URL='https://qqlqqknlqqdyukxoyyty.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbHFxa25scXFkeXVreG95eXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NTYzOTQsImV4cCI6MjA4ODEzMjM5NH0.jZBd3dM1aNjRqDXxL0a3p0V8BPtfdZ8I4LaAKN4_1mk';
const hdrs={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};

const params=new URLSearchParams(window.location.search);
const requestId=params.get('id');

if(!requestId){
  loadHub();
}else{
  loadRequest();
}

async function loadHub(){
  document.querySelector('.header h1').textContent='Spark Comps Hub';
  document.getElementById('statusBadge').textContent='PROJECTS';
  const reqSection=document.getElementById('requestSection');
  const grid=document.getElementById('compsGrid');
  reqSection.innerHTML='';
  grid.innerHTML='';

  try {
    const [reqRes, taskRes] = await Promise.all([
      fetch(SUPABASE_URL+'/rest/v1/marketing_requests?order=created_at.asc&limit=100',{headers:hdrs}),
      fetch(SUPABASE_URL+'/rest/v1/tasks?source=eq.spark-form&select=id,title,notes,status&order=created_at.desc&limit=100',{headers:hdrs})
    ]);

    const allReqs=await reqRes.json();
    const sparkTasks=await taskRes.json();
    const reqs=(allReqs||[]).filter(r=>!['delivered','cancelled','archived','done'].includes(String(r.status||'').toLowerCase()));

    if(!reqs.length){
      reqSection.innerHTML='<div class="request-card"><h2>No active Spark projects</h2></div>';
      return;
    }

    for (const r of reqs) {
      const types=(r.request_types||[]).join(', ') || 'Project';
      const linkedTask=(sparkTasks||[]).find(t => (t.notes||'').includes(`request_id:${r.id}`));

      const project=document.createElement('div');
      project.className='request-card';
      project.style.marginBottom='0.75rem';
      project.innerHTML=`
        <h2>⚡ ${escHtml(types)}</h2>
        <div class="request-meta">
          <span class="meta-tag">From: ${escHtml(r.requester_email||'unknown')}</span>
          <span class="meta-tag">${escHtml(r.urgency||'No Rush')}</span>
          <span class="meta-tag">${escHtml(r.status||'received')}</span>
          ${linkedTask ? `<span class="meta-tag">Task: ${escHtml(linkedTask.title||'linked')}</span>` : ''}
        </div>
        <div class="request-details">${escHtml(r.details||'')}</div>
        ${r.goal ? `<div class="request-goal">Goal: ${escHtml(r.goal)}</div>` : ''}
      `;
      reqSection.appendChild(project);

      const compRes=await fetch(SUPABASE_URL+'/rest/v1/spark_comps?request_id=eq.'+r.id+'&status=neq.rejected&order=option_number.asc',{headers:hdrs});
      const comps=await compRes.json();

      if(!comps.length){
        const empty=document.createElement('div');
        empty.className='request-card';
        empty.style.marginTop='0';
        empty.style.borderStyle='dashed';
        empty.innerHTML='<div class="request-details" style="color:#9ca3af">No comps yet for this project.</div>';
        reqSection.appendChild(empty);
      } else {
        const compGroup=document.createElement('div');
        compGroup.className='comps-grid';
        compGroup.style.paddingTop='0.5rem';
        comps.forEach(c=>compGroup.appendChild(buildCompCard(c)));
        reqSection.appendChild(compGroup);
      }

      const divider=document.createElement('hr');
      divider.style.cssText='max-width:800px;margin:1.5rem auto;border:none;border-top:1px solid #e5e7eb;';
      reqSection.appendChild(divider);
    }

  } catch(err) {
    reqSection.innerHTML='<div class="request-card"><h2>Error loading Spark hub</h2><p>'+escHtml(err.message)+'</p></div>';
  }
}

async function loadRequest(){
  document.querySelector('.header h1').textContent='Spark Review';
  document.getElementById('statusBadge').textContent='REVIEW';
  try{
  // Fetch request
  const reqRes=await fetch(SUPABASE_URL+'/rest/v1/marketing_requests?id=eq.'+requestId,{headers:hdrs});
  const reqs=await reqRes.json();
  if(!reqs.length){
    document.getElementById('requestSection').innerHTML='<div class="request-card"><h2>Request not found</h2></div>';
    return;
  }
  const r=reqs[0];
  const types=(r.request_types||[]).join(', ');
  const urgencyClass=r.urgency==='Today'?'urgency-today':r.urgency==='This Week'?'urgency-this-week':'';

  const reqCard=document.createElement('div');
  reqCard.className='request-card';
  const h2=document.createElement('h2');
  h2.textContent='⚡ '+types;
  reqCard.appendChild(h2);
  const meta=document.createElement('div');
  meta.className='request-meta';
  const fromTag=document.createElement('span');fromTag.className='meta-tag';fromTag.textContent='From: '+r.requester_email;meta.appendChild(fromTag);
  const urgTag=document.createElement('span');urgTag.className='meta-tag '+urgencyClass;urgTag.textContent=r.urgency;meta.appendChild(urgTag);
  if(r.target_date){const dt=document.createElement('span');dt.className='meta-tag';dt.textContent='📌 '+r.target_date;meta.appendChild(dt);}
  if((r.attachment_urls||[]).length){const at=document.createElement('span');at.className='meta-tag';at.textContent='📎 '+r.attachment_urls.length+' files';meta.appendChild(at);}
  reqCard.appendChild(meta);
  const det=document.createElement('div');det.className='request-details';det.textContent=r.details;reqCard.appendChild(det);
  if(r.goal){const gl=document.createElement('div');gl.className='request-goal';gl.textContent='Goal: '+r.goal;reqCard.appendChild(gl);}
  document.getElementById('requestSection').innerHTML='';
  document.getElementById('requestSection').appendChild(reqCard);

  // Fetch comps
  const compRes=await fetch(SUPABASE_URL+'/rest/v1/spark_comps?request_id=eq.'+requestId+'&status=neq.rejected&order=option_number.asc',{headers:hdrs});
  const comps=await compRes.json();
  const grid=document.getElementById('compsGrid');

  if(!comps.length){
    grid.innerHTML='<p style="text-align:center;color:#9ca3af;padding:2rem">Comps are being drafted. Check back shortly.</p>';
    return;
  }

  comps.forEach(c=> grid.appendChild(buildCompCard(c)));
  }catch(err){
    document.getElementById('compsGrid').innerHTML='<p style="color:red;padding:2rem">Error: '+err.message+'</p>';
    console.error(err);
  }
}

function buildCompCard(c){
  const card=document.createElement('div');
  card.className='comp-card';
  card.id='comp-'+c.id;

  const header=document.createElement('div');
  header.className='comp-header';
  header.innerHTML='<span class="comp-number">Option '+c.option_number+'</span><span class="comp-title">'+escHtml(c.title||'')+'</span><span class="approved-label">✅ APPROVED</span>';
  card.appendChild(header);

  if(c.comp_type==='image'){
    const imgWrap=document.createElement('div');
    imgWrap.className='comp-content';
    imgWrap.style.padding='0';imgWrap.style.overflow='hidden';imgWrap.style.borderRadius='8px';
    const img=document.createElement('img');
    img.src=c.content;
    img.alt=c.title||'Comp';
    img.style.cssText='width:100%;height:auto;display:block;border-radius:8px';
    imgWrap.appendChild(img);
    card.appendChild(imgWrap);
  } else {
    const content=document.createElement('div');
    content.className='comp-content';
    content.textContent=c.content;
    card.appendChild(content);
  }

  const actions=document.createElement('div');
  actions.className='comp-actions';
  const approveBtn=document.createElement('button');
  approveBtn.className='btn btn-approve';
  approveBtn.textContent='Approve';
  approveBtn.onclick=()=>approveComp(c.id);
  const rejectBtn=document.createElement('button');
  rejectBtn.className='btn btn-reject';
  rejectBtn.textContent='Reject';
  rejectBtn.onclick=()=>rejectComp(c.id);
  actions.appendChild(approveBtn);
  actions.appendChild(rejectBtn);
  card.appendChild(actions);
  return card;
}

async function approveComp(id){
  const res=await fetch(SUPABASE_URL+'/rest/v1/spark_comps?id=eq.'+id,{
    method:'PATCH',
    headers:hdrs,
    body:JSON.stringify({status:'approved',updated_at:new Date().toISOString()})
  });
  if(!res.ok) return;
  const card=document.getElementById('comp-'+id);
  if(card) card.classList.add('approved');
}

async function rejectComp(id){
  const res=await fetch(SUPABASE_URL+'/rest/v1/spark_comps?id=eq.'+id,{
    method:'PATCH',
    headers:hdrs,
    body:JSON.stringify({status:'rejected',updated_at:new Date().toISOString()})
  });
  if(!res.ok) return;
  const card=document.getElementById('comp-'+id);
  if(card) card.remove();
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
