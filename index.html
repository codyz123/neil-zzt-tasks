<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZT Tasks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #141B3A; --navy-light: #1e2752; --navy-lighter: #2a3468;
    --pink: #D69BC6; --cream: #FCFAF1; --lime: #D7DD38; --sky: #B9E3EA;
    --coral: #E85C41; --green: #529214; --blue: #3b82f6;
    --text: #2d2d2d; --text-light: #6b7280; --border: #e5e7eb;
    --bg: #f8f9fa; --white: #ffffff;
  }
  body { font-family: 'Inter Tight', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .mobile-nav { display: none; background: var(--navy); padding: 12px 16px; position: sticky; top: 0; z-index: 20; }
  .mobile-nav h1 { color: white; font-size: 16px; }
  .mobile-tabs { display: none; background: white; border-bottom: 1px solid var(--border); padding: 0 8px; overflow-x: auto; white-space: nowrap; position: sticky; top: 44px; z-index: 15; }
  .mobile-tabs .tab { display: inline-block; padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; }
  .mobile-tabs .tab.active { color: var(--navy); border-bottom-color: var(--navy); }

  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--navy); color: white; padding: 20px 0; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
  .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid var(--navy-lighter); margin-bottom: 8px; }
  .sidebar-logo h1 { font-size: 16px; font-weight: 700; }
  .sidebar-logo span { font-size: 11px; color: var(--pink); }
  .nav-section { padding: 14px 12px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.35); font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; color: rgba(255,255,255,0.65); cursor: pointer; border-left: 3px solid transparent; transition: all 0.12s; }
  .nav-item:hover { background: var(--navy-light); color: white; }
  .nav-item.active { background: var(--navy-light); color: white; border-left-color: var(--lime); }
  .nav-badge { margin-left: auto; background: var(--coral); color: white; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }
  .nav-badge.g { background: var(--green); }

  .main { margin-left: 220px; min-height: 100vh; }
  .topbar { background: white; border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  .topbar h2 { font-size: 20px; font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-date { font-size: 13px; color: var(--text-light); }

  .btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.12s; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 5px; }
  .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg); }



  .content { padding: 20px 28px 28px; }
  .panel { background: white; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header h3 { font-size: 14px; font-weight: 600; }
  .panel-count { font-size: 11px; color: var(--text-light); background: var(--bg); padding: 2px 9px; border-radius: 10px; }

  .task-list { list-style: none; }
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #f3f4f6; transition: background 0.08s; }
  .task-item:hover { background: #fafbfc; }
  .task-item:last-child { border-bottom: none; }

  .task-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d1d5db; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: all 0.12s; display: flex; align-items: center; justify-content: center; }
  .task-check:hover { border-color: var(--green); background: rgba(82,146,20,0.08); }
  .task-check.done { background: var(--green); border-color: var(--green); }
  .task-check.done::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .task-title.struck { text-decoration: line-through; color: var(--text-light); }
  .task-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 3px; font-weight: 500; }
  .tag-critical { background: #fef2f2; color: var(--coral); }
  .tag-high { background: #fff7ed; color: #c2410c; }
  .tag-medium { background: #f0fdf4; color: var(--green); }
  .tag-low { background: #f8fafc; color: #64748b; }
  .tag-cat { background: #eff6ff; color: #1d4ed8; }
  .tag-src { background: #faf5ff; color: #7c3aed; }
  .tag-type-task { background: #eef2ff; color: #3730a3; }
  .tag-type-reminder { background: #fffbeb; color: #b45309; }
  .tag-type-project { background: #eff6ff; color: var(--blue); }
  .task-due { font-size: 10px; color: var(--text-light); }
  .task-due.overdue { color: var(--coral); font-weight: 600; }
  .task-est { font-size: 11px; color: var(--text-light); margin-left: auto; white-space: nowrap; }

  /* Project card */
  .project-card { background: white; border: 2px solid var(--blue); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .project-header { padding: 14px 18px; background: #eff6ff; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .project-header:hover { background: #dbeafe; }
  .project-icon { font-size: 16px; }
  .project-name { font-size: 14px; font-weight: 600; flex: 1; }
  .project-progress { font-size: 11px; color: var(--text-light); }
  .project-progress-bar { width: 60px; height: 4px; background: #e5e7eb; border-radius: 2px; margin-left: 8px; display: inline-block; vertical-align: middle; }
  .project-progress-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.3s; }
  .project-subtasks { border-top: 1px solid #e5e7eb; }
  .project-subtasks .task-item.highlighted { background: #eff6ff; border-left: 3px solid var(--blue); }
  .project-subtasks .task-item.not-today { opacity: 0.5; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 12px; width: 90%; max-width: 500px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal label { font-size: 12px; font-weight: 500; color: var(--text-light); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-light); font-size: 14px; }

  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; }
  .detail-overlay.show { display: block; }
  .detail-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 420px; background: white; box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 45; overflow-y: auto; padding: 24px; display: none; }
  .detail-panel.show { display: block; }
  .detail-field { margin-bottom: 14px; }
  .detail-field label { font-size: 11px; font-weight: 500; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
  .detail-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); }
  .loading { padding: 40px; text-align: center; color: var(--text-light); }

  .fab { position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%; background: var(--navy); color: white; font-size: 28px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 30; display: flex; align-items: center; justify-content: center; transition: transform 0.12s, background 0.12s; }
  .fab:hover { background: var(--navy-light); transform: scale(1.08); }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .mobile-nav, .mobile-tabs { display: block; }
    .main { margin-left: 0; }
    .topbar { display: none; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 12px 12px 0; gap: 8px; }
    .content { padding: 12px; }
    .task-desc { max-width: 200px; }
    .detail-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="mobile-nav"><h1>ZZT Tasks</h1></div>
<div class="mobile-tabs" id="mobileTabs"></div>
<nav class="sidebar" id="sidebar"></nav>

<div class="main">
  <div class="topbar" id="topbar"></div>
  <!-- stats removed for cleaner UI -->
  <div class="content" id="content"><div class="loading">Loading tasks...</div></div>
</div>

<button class="fab" onclick="openAddModal()" title="Add Task">+</button>

<!-- Add Task Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add Task</h3>
    <label>Title *</label>
    <input type="text" id="newTitle" placeholder="What needs to be done?">
    <label>Description</label>
    <textarea id="newDesc" placeholder="Additional context (optional)"></textarea>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div><label>Priority</label><select id="newPriority"><option value="medium">Medium</option><option value="critical">Critical</option><option value="high">High</option><option value="low">Low</option></select></div>
      <div><label>Type</label><select id="newType"><option value="task">Task</option><option value="reminder">Reminder</option><option value="project">Project</option></select></div>
    </div>
    <div>
      <label>Due Date</label><input type="date" id="newDue">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">×</button>
  <div id="detailContent"></div>
</div>

<script>
const SUPABASE_URL = 'https://qqlqqknlqqdyukxoyyty.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbHFxa25scXFkeXVreG95eXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NTYzOTQsImV4cCI6MjA4ODEzMjM5NH0.jZBd3dM1aNjRqDXxL0a3p0V8BPtfdZ8I4LaAKN4_1mk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allTasks = [];
let sparkProjects = [];
let requestsWithComps = new Set();
let currentView = 'inbox';
let showCompleted = false;
const today = new Date().toISOString().slice(0, 10);

const VIEWS = [
  { id: 'inbox', icon: '📥', label: 'Inbox' },
  { id: 'today', icon: '🎯', label: 'Today' },
  { id: 'queue', icon: '📋', label: 'Task Queue' },
];

const PRIO_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const PRIO_TAG = { critical: 'tag-critical', high: 'tag-high', medium: 'tag-medium', low: 'tag-low' };
const SRC_ICON = { email: '📧', 'spark-form': '⚡', conversation: '💬', manual: '✏️', cron: '⚙️' };

// --- Helpers ---
function tags(t) { return Array.isArray(t.tags) ? t.tags.map(x => String(x).toLowerCase()) : []; }
function isReminder(t) { return tags(t).includes('reminder'); }
function isProject(t) { return tags(t).includes('project'); }
function isSubtask(t) { return !!t.depends_on; }
function getType(t) { if (isProject(t)) return 'project'; if (isReminder(t)) return 'reminder'; return 'task'; }
function isOpen(t) { return !['done','cancelled'].includes(t.status); }
function priorityScore(t) { return PRIO_ORDER[t.priority] ?? 2; }
function subtasksOf(parentId) { return allTasks.filter(t => t.depends_on === parentId); }

function daysUntil(d) {
  if (!d) return null;
  return Math.floor((new Date(d+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
}

// --- View Logic ---
// Inbox: status=inbox, not a subtask
function getInbox() {
  return allTasks.filter(t => t.status === 'inbox' && !isSubtask(t))
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}

// Today: status=active + tags include force-today, OR scheduled_date=today, OR due today/overdue + active
// Plus: all reminders with due_date = today
// Plus: projects that have subtasks scheduled for today
function getToday() {
  const items = allTasks.filter(t => {
    if (!isOpen(t) || t.status === 'inbox') return false;
    if (isSubtask(t)) return false; // subtasks render inside project cards
    if (tags(t).includes('force-today')) return true;
    if (t.scheduled_date === today) return true;
    if (t.due_date && t.due_date <= today) return true;
    // Projects: show if any subtask is scheduled today or due today
    if (isProject(t)) {
      const subs = subtasksOf(t.id);
      return subs.some(s => isOpen(s) && (s.scheduled_date === today || (s.due_date && s.due_date <= today)));
    }
    return false;
  });
  return items.sort((a,b) => priorityScore(a) - priorityScore(b));
}

// Queue: everything active that's not in inbox and not in today (and not subtasks)
function getQueue() {
  const todayIds = new Set(getToday().map(t => t.id));
  return allTasks.filter(t => {
    if (!isOpen(t)) return false;
    if (t.status === 'inbox') return false;
    if (isSubtask(t)) return false;
    if (todayIds.has(t.id)) return false;
    if (showCompleted === false && t.status === 'done') return false;
    return true;
  }).sort((a,b) => {
    const p = priorityScore(a) - priorityScore(b);
    if (p !== 0) return p;
    const ad = a.due_date || '9999-12-31';
    const bd = b.due_date || '9999-12-31';
    return ad.localeCompare(bd);
  });
}

function getCounts() {
  return { inbox: getInbox().length, today: getToday().length, queue: getQueue().length };
}

// --- Load ---
async function loadTasks() {
  const { data, error } = await sb.from('tasks').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allTasks = data || [];
  await loadSparkProjects();
  render();
}

async function loadSparkProjects() {
  const { data } = await sb.from('marketing_requests')
    .select('id,request_types,requester_email,status,created_at')
    .order('created_at', { ascending: false }).limit(20);
  sparkProjects = (data || []).filter(r => !['delivered','cancelled','archived','done'].includes(String(r.status||'').toLowerCase()));

  // Load which requests actually have comps
  const { data: comps } = await sb.from('spark_comps')
    .select('request_id')
    .not('status','eq','rejected');
  requestsWithComps = new Set((comps||[]).map(c=>c.request_id));
}

// --- Render ---
function render() { renderSidebar(); renderTopbar(); renderContent(); }

function renderSidebar() {
  const counts = getCounts();
  const overdue = allTasks.filter(t => t.due_date && t.due_date < today && isOpen(t) && !isSubtask(t)).length;
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-logo"><h1>ZERO ZERO TWO</h1><span>Task Manager</span></div>
    <div class="nav-section">Views</div>
    ${VIEWS.map(v => `
      <div class="nav-item ${currentView===v.id?'active':''}" onclick="switchView('${v.id}')">
        ${v.icon} ${v.label}
        ${counts[v.id]>0?`<span class="nav-badge ${v.id==='today'?'':'g'}">${counts[v.id]}</span>`:''}
      </div>
    `).join('')}
    ${overdue>0?`<div class="nav-item" style="color:var(--coral);" onclick="switchView('today')">⚠️ Overdue <span class="nav-badge">${overdue}</span></div>`:''}
    <div class="nav-section">Spark Comps</div>
    <a class="nav-item" href="comps.html" style="text-decoration:none;color:inherit;">
      <span>⚡ Comps Hub</span>
      <span class="nav-badge" style="background:#E3FB61;color:#141B3A">${sparkProjects.length}</span>
    </a>

  `;
  document.getElementById('mobileTabs').innerHTML = VIEWS.map(v =>
    `<span class="tab ${currentView===v.id?'active':''}" onclick="switchView('${v.id}')">${v.icon} ${v.label}</span>`
  ).join('') + `<a class="tab" href="comps.html" style="text-decoration:none;color:inherit;">⚡ Comps</a>`;
}

function renderTopbar() {
  const label = VIEWS.find(v=>v.id===currentView)?.label||'Tasks';
  const d = new Date();
  const dateStr = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('topbar').innerHTML = `
    <h2>${label}</h2>
    <div class="topbar-right">
      <span class="topbar-date">${dateStr}</span>
      ${currentView==='queue'?`<button class="btn btn-outline" onclick="toggleCompletedVisibility()">${showCompleted?'Hide Done':'Show Done'}</button>`:''}
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Task</button>
    </div>
  `;
}


function renderContent() {
  let tasks;
  switch(currentView) {
    case 'inbox': tasks = getInbox(); break;
    case 'today': tasks = getToday(); break;
    case 'queue': tasks = getQueue(); break;
    default: tasks = [];
  }

  if (tasks.length === 0) {
    const msgs = { inbox:'📥 Inbox clear — nothing to review.', today:'🎯 Today is clear.', queue:'📋 Queue is empty.' };
    document.getElementById('content').innerHTML = `<div class="panel"><div class="empty">${msgs[currentView]||'Nothing here.'}</div></div>`;
    return;
  }

  if (currentView === 'today') {
    // Split: projects, tasks, reminders
    const projects = tasks.filter(t => isProject(t));
    const reminders = tasks.filter(t => isReminder(t) && !isProject(t));
    const work = tasks.filter(t => !isProject(t) && !isReminder(t));

    let html = '';
    if (projects.length) html += renderProjectCards(projects);
    if (work.length) html += renderSection('🎯 Tasks', work);
    if (reminders.length) html += renderSection('🔔 Reminders', reminders);
    document.getElementById('content').innerHTML = html;
  } else {
    // Inbox and Queue: flat list, but projects show as project cards
    const projects = tasks.filter(t => isProject(t));
    const flat = tasks.filter(t => !isProject(t));

    let html = '';
    if (projects.length) html += renderProjectCards(projects);
    if (flat.length) html += renderSection(VIEWS.find(v=>v.id===currentView)?.label||'Tasks', flat);
    document.getElementById('content').innerHTML = html;
  }
}

function renderProjectCards(projects) {
  return projects.map(p => {
    const subs = subtasksOf(p.id).sort((a,b) => {
      const aDone = a.status==='done'?1:0, bDone=b.status==='done'?1:0;
      if(aDone!==bDone) return aDone-bDone;
      return priorityScore(a)-priorityScore(b);
    });
    const done = subs.filter(s=>s.status==='done').length;
    const total = subs.length;
    const pct = total>0 ? Math.round(done/total*100) : 0;

    // Determine which subtasks are "today" (highlighted)
    const todaySubIds = new Set();
    subs.forEach(s => {
      if(isOpen(s) && (s.scheduled_date===today || (s.due_date && s.due_date<=today))) todaySubIds.add(s.id);
    });

    return `
      <div class="project-card">
        <div class="project-header" onclick="openDetail('${p.id}')">
          <span class="project-icon">🔷</span>
          <span class="project-name">${esc(p.title)}</span>
          <span class="project-progress">${done}/${total}
            <span class="project-progress-bar"><span class="project-progress-fill" style="width:${pct}%"></span></span>
          </span>
          <span class="tag ${PRIO_TAG[p.priority]}">${p.priority}</span>
        </div>
        ${subs.length ? `<div class="project-subtasks"><ul class="task-list">
          ${subs.map(s => {
            const highlighted = todaySubIds.has(s.id);
            const notToday = !highlighted && s.status!=='done';
            return `<li class="task-item ${highlighted?'highlighted':''} ${notToday?'not-today':''}">
              <div class="task-check ${s.status==='done'?'done':''}" onclick="event.stopPropagation();toggleDone('${s.id}',${s.status==='done'})"></div>
              <div class="task-body" onclick="openDetail('${s.id}')" style="cursor:pointer">
                <div class="task-title ${s.status==='done'?'struck':''}">${esc(s.title)}</div>
                ${s.due_date?`<span class="task-due ${s.due_date<today&&s.status!=='done'?'overdue':''}">${s.due_date<=today?(s.due_date<today?'Overdue':'Due today'):'Due '+s.due_date}</span>`:''}
              </div>
            </li>`;
          }).join('')}
        </ul></div>` : `<div style="padding:12px 18px;color:var(--text-light);font-size:12px;">No subtasks yet. Open project to add.</div>`}
      </div>
    `;
  }).join('');
}

function renderSection(title, tasks) {
  if (!tasks.length) return '';
  return `<div class="panel">
    <div class="panel-header"><h3>${title}</h3><span class="panel-count">${tasks.length}</span></div>
    <ul class="task-list">${tasks.map(renderTaskItem).join('')}</ul>
  </div>`;
}

function renderTaskItem(t) {
  const isDone = t.status==='done';
  const isOverdue = t.due_date && t.due_date<today && !isDone;
  const isDueToday = t.due_date===today;
  let dueLabel = '';
  if(isOverdue) dueLabel=`<span class="task-due overdue">Overdue · ${t.due_date}</span>`;
  else if(isDueToday) dueLabel=`<span class="task-due" style="color:#d97706;font-weight:600">Due today</span>`;
  else if(t.due_date) dueLabel=`<span class="task-due">Due ${t.due_date}</span>`;

  const type = getType(t);
  const typeBadge = type==='reminder' ? '<span class="tag tag-type-reminder">🔔 reminder</span>'
    : type==='project' ? '<span class="tag tag-type-project">🔷 project</span>'
    : '<span class="tag tag-type-task">✅ task</span>';

  return `<li class="task-item">
    <div class="task-check ${isDone?'done':''}" onclick="event.stopPropagation();toggleDone('${t.id}',${isDone})"></div>
    <div class="task-body" onclick="openDetail('${t.id}')" style="cursor:pointer">
      <div class="task-title ${isDone?'struck':''}">${esc(t.title)}</div>
      ${t.description?`<div class="task-desc">${esc(t.description)}</div>`:''}
      <div class="task-meta">
        <span class="tag ${PRIO_TAG[t.priority]}">${t.priority}</span>
        ${typeBadge}
        ${t.source?`<span class="tag tag-src">${SRC_ICON[t.source]||''} ${t.source}</span>`:''}
        ${(()=>{ if(t.source!=='spark-form') return ''; const rid=(t.notes||'').match(/request_id:([a-f0-9-]+)/)?.[1]||''; return rid && requestsWithComps.has(rid) ? `<a href="comps.html?id=${rid}" onclick="event.stopPropagation()" class="tag" style="background:#E3FB61;color:#141B3A;font-weight:700;text-decoration:none">⚡ Comps →</a>` : ''; })()}
        ${dueLabel}
        ${t.assigned_to&&t.assigned_to!=='neil'?`<span class="task-due">→ ${t.assigned_to}</span>`:''}
      </div>
    </div>
    ${t.estimated_minutes?`<span class="task-est">~${t.estimated_minutes}m</span>`:''}
  </li>`;
}

// --- Actions ---
function switchView(v) { currentView=v; render(); }
function toggleCompletedVisibility() { showCompleted=!showCompleted; render(); }

function filterCategory(cat) {
  currentView='queue'; render();
  const tasks=allTasks.filter(t=>t.category===cat&&isOpen(t)&&!isSubtask(t)).sort((a,b)=>priorityScore(a)-priorityScore(b));
  document.getElementById('content').innerHTML = renderSection(`${cat[0].toUpperCase()+cat.slice(1)} Tasks`, tasks);
}

async function toggleDone(id,wasDone) {
  const newStatus=wasDone?'active':'done';
  const update={status:newStatus};
  if(!wasDone) update.completed_at=new Date().toISOString(); else update.completed_at=null;
  const {error}=await sb.from('tasks').update(update).eq('id',id);
  if(error){console.error(error);return;}
  const t=allTasks.find(t=>t.id===id);
  if(t){t.status=newStatus;t.completed_at=update.completed_at;}

  // If all subtasks done, auto-complete parent project
  if(!wasDone && t && t.depends_on) {
    const parent = allTasks.find(p=>p.id===t.depends_on);
    if(parent && isProject(parent)) {
      const subs = subtasksOf(parent.id);
      if(subs.length && subs.every(s=>s.status==='done')) {
        await sb.from('tasks').update({status:'done',completed_at:new Date().toISOString()}).eq('id',parent.id);
        parent.status='done'; parent.completed_at=new Date().toISOString();
      }
    }
  }
  render();
}

function openDetail(id) {
  const t=allTasks.find(t=>t.id===id);
  if(!t) return;
  const type=getType(t);
  const parentProject = t.depends_on ? allTasks.find(p=>p.id===t.depends_on) : null;

  let subtaskHtml = '';
  if(isProject(t)) {
    const subs=subtasksOf(t.id);
    subtaskHtml = `
      <div class="detail-field"><label>Subtasks (${subs.filter(s=>s.status==='done').length}/${subs.length})</label>
        <ul style="list-style:none;padding:0;">
          ${subs.map(s=>`<li style="padding:4px 0;font-size:12px;${s.status==='done'?'text-decoration:line-through;color:var(--text-light);':''}">
            ${s.status==='done'?'✅':'⬜'} ${esc(s.title)}
          </li>`).join('')}
        </ul>
        <button class="btn btn-outline btn-sm" onclick="openAddSubtask('${t.id}')" style="margin-top:8px;">+ Add Subtask</button>
      </div>
    `;
  }

  document.getElementById('detailContent').innerHTML = `
    ${parentProject?`<div style="font-size:11px;color:var(--blue);margin-bottom:8px;">🔷 ${esc(parentProject.title)}</div>`:''}
    <div class="detail-field"><label>Title</label>
      <input value="${esc(t.title)}" onchange="updateField('${t.id}','title',this.value)" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:13px;font-weight:600;" />
    </div>
    <div class="detail-field"><label>Description</label>
      <textarea onchange="updateField('${t.id}','description',this.value)" style="width:100%;min-height:84px;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:12px;line-height:1.4;resize:vertical;">${esc(t.description||'')}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="detail-field"><label>Status</label>
        <select onchange="updateField('${t.id}','status',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
          ${['inbox','today','queue','done','cancelled'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="detail-field"><label>Priority</label>
        <select onchange="updateField('${t.id}','priority',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
          ${['critical','high','medium','low'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="detail-field"><label>Type</label>
      <select onchange="updateType('${t.id}',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
        <option value="task" ${type==='task'?'selected':''}>✅ Task</option>
        <option value="reminder" ${type==='reminder'?'selected':''}>🔔 Reminder</option>
        <option value="project" ${type==='project'?'selected':''}>🔷 Project</option>
      </select>
    </div>
    <div class="detail-field"><label>Due Date</label>
      <input type="date" value="${t.due_date||''}" onchange="updateField('${t.id}','due_date',this.value||null)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;" />
    </div>
    <div class="detail-field"><label>Assigned To</label><div style="font-size:13px;">${t.assigned_to||'neil'}</div></div>
    ${t.notes?`<div class="detail-field"><label>Notes</label><div style="font-size:12px;white-space:pre-wrap;">${esc(t.notes)}</div></div>`:''}
    ${subtaskHtml}
    <div class="detail-field"><label>Created</label><div style="font-size:12px;">${new Date(t.created_at).toLocaleString()} by ${t.created_by}</div></div>
    ${t.completed_at?`<div class="detail-field"><label>Completed</label><div style="font-size:12px;">${new Date(t.completed_at).toLocaleString()}</div></div>`:''}
    <div style="margin-top:20px;display:flex;gap:8px;">
      ${t.status!=='done'?`<button class="btn btn-primary btn-sm" onclick="toggleDone('${t.id}',false);closeDetail();">✓ Done</button>`:''}
      <button class="btn btn-outline btn-sm" onclick="moveToToday('${t.id}')">→ Move to Today</button>
      <button class="btn btn-outline btn-sm" onclick="moveToQueue('${t.id}')">→ Queue</button>
      <button class="btn btn-outline btn-sm" style="color:var(--coral);" onclick="deleteTask('${t.id}')">🗑</button>
    </div>
  `;
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('detailOverlay').classList.remove('show');
}

async function moveToToday(id) {
  // Set scheduled_date to today and status to active
  await updateField(id,'scheduled_date',today);
  if(allTasks.find(t=>t.id===id)?.status==='inbox') await updateField(id,'status','active');
  closeDetail();
}

async function moveToQueue(id) {
  // Clear scheduled_date, set status to active
  await updateField(id,'scheduled_date',null);
  if(allTasks.find(t=>t.id===id)?.status==='inbox') await updateField(id,'status','active');
  // Remove force-today tag
  const t=allTasks.find(t=>t.id===id);
  if(t) {
    let tgs=Array.isArray(t.tags)?[...t.tags]:[];
    tgs=tgs.filter(x=>String(x).toLowerCase()!=='force-today');
    await updateField(id,'tags',tgs.length?tgs:null);
  }
  closeDetail();
}

async function updateType(id, typeValue) {
  const t=allTasks.find(x=>x.id===id)||{};
  let tgs=Array.isArray(t.tags)?[...t.tags]:[];
  tgs=tgs.filter(x=>!['reminder','project'].includes(String(x).toLowerCase()));
  if(typeValue==='reminder') tgs.push('reminder');
  if(typeValue==='project') tgs.push('project');
  await updateField(id,'tags',tgs.length?tgs:null);
}

async function updateField(id,field,value) {
  if(field==='title'&&!String(value||'').trim()){alert('Title cannot be empty');return;}
  const update={};
  update[field]=field==='title'?String(value).trim():value;
  if(field==='status'&&value==='done') update.completed_at=new Date().toISOString();
  if(field==='status'&&value!=='done') update.completed_at=null;
  const {error}=await sb.from('tasks').update(update).eq('id',id);
  if(error){console.error(error);return;}
  const t=allTasks.find(t=>t.id===id);
  if(t){t[field]=update[field];if(update.completed_at!==undefined)t.completed_at=update.completed_at;}
  render();
}

async function deleteTask(id) {
  if(!confirm('Delete this task?')) return;
  await sb.from('tasks').delete().eq('id',id);
  allTasks=allTasks.filter(t=>t.id!==id);
  closeDetail(); render();
}

function openAddModal() { document.getElementById('addModal').classList.add('show'); document.getElementById('newTitle').focus(); }
function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }

async function addTask() {
  const title=document.getElementById('newTitle').value.trim();
  if(!title) return;
  const typeVal=document.getElementById('newType').value;
  let tgs=[];
  if(typeVal==='reminder') tgs.push('reminder');
  if(typeVal==='project') tgs.push('project');

  const task={
    title,
    description: document.getElementById('newDesc').value.trim()||null,
    priority: document.getElementById('newPriority').value,
    category: 'business',
    due_date: document.getElementById('newDue').value||null,
    status: 'inbox',
    source: 'manual',
    assigned_to: 'neil',
    created_by: 'neil',
    tags: tgs.length?tgs:null,
  };
  const {data,error}=await sb.from('tasks').insert(task).select();
  if(error){console.error(error);alert('Error adding task');return;}
  if(data) allTasks.unshift(data[0]);
  closeAddModal();
  document.getElementById('newTitle').value='';
  document.getElementById('newDesc').value='';
  document.getElementById('newDue').value='';
  render();
}

function openAddSubtask(parentId) {
  closeDetail();
  const title=prompt('Subtask title:');
  if(!title||!title.trim()) return;
  addSubtask(parentId,title.trim());
}

async function addSubtask(parentId,title) {
  const parent=allTasks.find(t=>t.id===parentId);
  const task={
    title,
    priority: parent?.priority||'medium',
    category: parent?.category||'business',
    status: 'active',
    source: 'manual',
    assigned_to: 'neil',
    created_by: 'neil',
    depends_on: parentId,
  };
  const {data,error}=await sb.from('tasks').insert(task).select();
  if(error){console.error(error);return;}
  if(data) allTasks.unshift(data[0]);
  render();
  openDetail(parentId);
}

function esc(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAddModal();closeDetail();}
  if(e.key==='n'&&!e.metaKey&&!e.ctrlKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();openAddModal();}
});

loadTasks();
setInterval(loadTasks,60000);
</script>
