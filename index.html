<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZT Tasks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #141B3A; --navy-light: #1e2752; --navy-lighter: #2a3468;
    --pink: #D69BC6; --cream: #FCFAF1; --lime: #D7DD38; --sky: #B9E3EA;
    --coral: #E85C41; --green: #529214; --blue: #3b82f6;
    --text: #2d2d2d; --text-light: #6b7280; --border: #e5e7eb;
    --bg: #f8f9fa; --white: #ffffff;
  }
  body { font-family: 'Inter Tight', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .mobile-nav { display: none; background: var(--navy); padding: 12px 16px; position: sticky; top: 0; z-index: 20; }
  .mobile-nav h1 { color: white; font-size: 16px; }
  .mobile-tabs { display: none; background: white; border-bottom: 1px solid var(--border); padding: 0 8px; overflow-x: auto; white-space: nowrap; position: sticky; top: 44px; z-index: 15; }
  .mobile-tabs .tab { display: inline-block; padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; }
  .mobile-tabs .tab.active { color: var(--navy); border-bottom-color: var(--navy); }

  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--navy); color: white; padding: 20px 0; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
  .sidebar-logo { padding: 0 20px 20px; border-bottom: 1px solid var(--navy-lighter); margin-bottom: 8px; }
  .sidebar-logo h1 { font-size: 16px; font-weight: 700; }
  .sidebar-logo span { font-size: 11px; color: var(--pink); }
  .nav-section { padding: 14px 12px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: rgba(255,255,255,0.35); font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; color: rgba(255,255,255,0.65); cursor: pointer; border-left: 3px solid transparent; transition: all 0.12s; }
  .nav-item:hover { background: var(--navy-light); color: white; }
  .nav-item.active { background: var(--navy-light); color: white; border-left-color: var(--lime); }
  .nav-badge { margin-left: auto; background: var(--coral); color: white; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }
  .nav-badge.g { background: var(--green); }

  .main { margin-left: 220px; min-height: 100vh; }
  .topbar { background: white; border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; }
  .topbar h2 { font-size: 20px; font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-date { font-size: 13px; color: var(--text-light); }

  .btn { padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.12s; }
  .btn-primary { background: var(--navy); color: white; }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 5px; }
  .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg); }



  .content { padding: 20px 28px 28px; }
  .panel { background: white; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header h3 { font-size: 14px; font-weight: 600; }
  .panel-count { font-size: 11px; color: var(--text-light); background: var(--bg); padding: 2px 9px; border-radius: 10px; }

  .task-list { list-style: none; }
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #f3f4f6; transition: background 0.08s; }
  .task-item:hover { background: #fafbfc; }
  .task-item:last-child { border-bottom: none; }

  .task-check { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d1d5db; flex-shrink: 0; margin-top: 2px; cursor: pointer; transition: all 0.12s; display: flex; align-items: center; justify-content: center; }
  .task-check:hover { border-color: var(--green); background: rgba(82,146,20,0.08); }
  .task-check.done { background: var(--green); border-color: var(--green); }
  .task-check.done::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 13px; font-weight: 500; line-height: 1.35; }
  .task-title.struck { text-decoration: line-through; color: var(--text-light); }
  .task-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
  .task-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 3px; font-weight: 500; }
  .tag-critical { background: #fef2f2; color: var(--coral); }
  .tag-high { background: #fff7ed; color: #c2410c; }
  .tag-medium { background: #f0fdf4; color: var(--green); }
  .tag-low { background: #f8fafc; color: #64748b; }
  .tag-cat { background: #eff6ff; color: #1d4ed8; }
  .tag-src { background: #faf5ff; color: #7c3aed; }
  .tag-type-task { background: #eef2ff; color: #3730a3; }
  .tag-type-reminder { background: #fffbeb; color: #b45309; }
  .tag-type-project { background: #eff6ff; color: var(--blue); }
  .task-due { font-size: 10px; color: var(--text-light); }
  .task-due.overdue { color: var(--coral); font-weight: 600; }
  .task-est { font-size: 11px; color: var(--text-light); margin-left: auto; white-space: nowrap; }

  /* Project card */
  .project-card { background: white; border: 2px solid var(--blue); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .project-header { padding: 14px 18px; background: #eff6ff; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .project-header:hover { background: #dbeafe; }
  .project-icon { font-size: 16px; }
  .project-name { font-size: 14px; font-weight: 600; flex: 1; }
  .project-progress { font-size: 11px; color: var(--text-light); }
  .project-progress-bar { width: 60px; height: 4px; background: #e5e7eb; border-radius: 2px; margin-left: 8px; display: inline-block; vertical-align: middle; }
  .project-progress-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width 0.3s; }
  .project-subtasks { border-top: 1px solid #e5e7eb; }
  .project-subtasks .task-item.highlighted { background: #eff6ff; border-left: 3px solid var(--blue); }
  .project-subtasks .task-item.not-today { opacity: 0.5; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 12px; width: 90%; max-width: 500px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .modal label { font-size: 12px; font-weight: 500; color: var(--text-light); display: block; margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--text-light); font-size: 14px; }

  .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 40; }
  .detail-overlay.show { display: block; }
  .detail-panel { position: fixed; right: 0; top: 0; bottom: 0; width: 420px; background: white; box-shadow: -4px 0 20px rgba(0,0,0,0.1); z-index: 45; overflow-y: auto; padding: 24px; display: none; }
  .detail-panel.show { display: block; }
  .detail-field { margin-bottom: 14px; }
  .detail-field label { font-size: 11px; font-weight: 500; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 3px; }
  .detail-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); }
  .loading { padding: 40px; text-align: center; color: var(--text-light); }

  .fab { position: fixed; top: 8px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: var(--navy); font-size: 22px; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 25; display: flex; align-items: center; justify-content: center; transition: transform 0.12s; }
  .fab:hover { transform: scale(1.08); }
  @media (min-width: 769px) { .fab { top: 16px; right: 28px; z-index: 6; } }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .mobile-nav, .mobile-tabs { display: block; }
    .main { margin-left: 0; }
    .topbar { display: none; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 12px 12px 0; gap: 8px; }
    .content { padding: 12px; }
    .task-desc { max-width: 200px; }
    .detail-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="mobile-nav"><h1>ZZT Tasks</h1></div>
<div class="mobile-tabs" id="mobileTabs"></div>
<nav class="sidebar" id="sidebar"></nav>

<div class="main">
  <div class="topbar" id="topbar"></div>
  <!-- stats removed for cleaner UI -->
  <div class="content" id="content"><div class="loading">Loading tasks...</div></div>
</div>

<button class="fab" onclick="openAddModal()" title="Add Task">+</button>

<!-- Add Task Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add Task</h3>
    <label>Title *</label>
    <input type="text" id="newTitle" placeholder="What needs to be done?">
    <label>Description</label>
    <textarea id="newDesc" placeholder="Additional context (optional)"></textarea>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div><label>Priority</label><select id="newPriority"><option value="medium">Medium</option><option value="critical">Critical</option><option value="high">High</option><option value="low">Low</option></select></div>
      <div><label>Type</label><select id="newType"><option value="task">Task</option><option value="reminder">Reminder</option><option value="project">Project</option></select></div>
    </div>
    <div>
      <label>Due Date</label><input type="date" id="newDue">
    </div>
    <div>
      <label>Add as project task under project</label>
      <select id="newParentProject"><option value="">None</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <button class="detail-close" onclick="closeDetail()">×</button>
  <div id="detailContent"></div>
</div>

<script>
const SUPABASE_URL = 'https://qqlqqknlqqdyukxoyyty.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbHFxa25scXFkeXVreG95eXR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NTYzOTQsImV4cCI6MjA4ODEzMjM5NH0.jZBd3dM1aNjRqDXxL0a3p0V8BPtfdZ8I4LaAKN4_1mk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const APP_VERSION = '2026.04.17-item-model';
const MODEL_KIND_PREFIX = 'kind:';
const ITEM_KIND = {
  PROJECT: 'project',
  TASK: 'task',
  REMINDER: 'reminder',
  PROJECT_TASK: 'project_task',
};

let allTasks = [];
let sparkProjects = [];
let requestsWithComps = new Set();
let currentView = 'inbox';
let showCompleted = false;
const today = new Date().toISOString().slice(0, 10);

const VIEWS = [
  { id: 'inbox', icon: '📥', label: 'Inbox' },
  { id: 'today', icon: '🎯', label: 'Today' },
  { id: 'queue', icon: '📋', label: 'Task Queue' },
];

const PRIO_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
const PRIO_TAG = { critical: 'tag-critical', high: 'tag-high', medium: 'tag-medium', low: 'tag-low' };
const SRC_ICON = { email: '📧', 'spark-form': '⚡', conversation: '💬', manual: '✏️', cron: '⚙️' };
const TYPE_BADGE = {
  [ITEM_KIND.TASK]: '<span class="tag tag-type-task">✅ task</span>',
  [ITEM_KIND.REMINDER]: '<span class="tag tag-type-reminder">🔔 reminder</span>',
  [ITEM_KIND.PROJECT]: '<span class="tag tag-type-project">🔷 project</span>',
  [ITEM_KIND.PROJECT_TASK]: '<span class="tag tag-type-project">🧩 project task</span>',
};

function rawTags(task) {
  return Array.isArray(task?.tags) ? task.tags.map(tag => String(tag)) : [];
}

function tags(task) {
  return rawTags(task).map(tag => tag.toLowerCase());
}

function getExplicitKindTag(task) {
  return tags(task).find(tag => tag.startsWith(MODEL_KIND_PREFIX)) || null;
}

function getLegacyProjectId(task) {
  if (!task) return null;
  if (task.parent_id) return task.parent_id;
  if (Array.isArray(task.depends_on)) return task.depends_on[0] || null;
  return task.depends_on || null;
}

function inferItemKind(task, knownIds = null) {
  const explicit = getExplicitKindTag(task);
  if (explicit) {
    const explicitKind = explicit.slice(MODEL_KIND_PREFIX.length);
    if (Object.values(ITEM_KIND).includes(explicitKind)) return explicitKind;
  }

  const legacyTags = tags(task);
  const projectId = getLegacyProjectId(task);
  const hasValidProject = projectId && (!knownIds || knownIds.has(projectId));
  if (hasValidProject) return ITEM_KIND.PROJECT_TASK;
  if (legacyTags.includes('project')) return ITEM_KIND.PROJECT;
  if (legacyTags.includes('reminder')) return ITEM_KIND.REMINDER;
  return ITEM_KIND.TASK;
}

function normalizeTask(task, knownIds = null) {
  const itemKind = inferItemKind(task, knownIds);
  const projectId = itemKind === ITEM_KIND.PROJECT_TASK ? getLegacyProjectId(task) : null;
  return {
    ...task,
    _itemKind: itemKind,
    _projectId: projectId,
    _isTopLevel: !projectId,
  };
}

function normalizeTasks(tasks) {
  const knownIds = new Set((tasks || []).map(task => task.id));
  return (tasks || []).map(task => normalizeTask(task, knownIds));
}

function getTask(id) {
  return allTasks.find(task => task.id === id) || null;
}

function isOpen(task) {
  return !['done', 'cancelled'].includes(task.status);
}

function isProject(task) {
  return task?._itemKind === ITEM_KIND.PROJECT;
}

function isReminder(task) {
  return task?._itemKind === ITEM_KIND.REMINDER;
}

function isProjectTask(task) {
  return task?._itemKind === ITEM_KIND.PROJECT_TASK;
}

function isTopLevel(task) {
  return !!task?._isTopLevel;
}

function priorityScore(task) {
  return PRIO_ORDER[task.priority] ?? 2;
}

function compareTasks(a, b) {
  const prio = priorityScore(a) - priorityScore(b);
  if (prio !== 0) return prio;
  const aDue = a.due_date || '9999-12-31';
  const bDue = b.due_date || '9999-12-31';
  if (aDue !== bDue) return aDue.localeCompare(bDue);
  return new Date(b.created_at || 0) - new Date(a.created_at || 0);
}

function projectTasksOf(projectId) {
  return allTasks.filter(task => task._projectId === projectId);
}

function projectOptionsHtml(selectedId = '') {
  const projects = allTasks
    .filter(task => isProject(task))
    .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  const opts = ['<option value="">None</option>'];
  projects.forEach(project => {
    opts.push(`<option value="${project.id}" ${selectedId === project.id ? 'selected' : ''}>${esc(project.title)}</option>`);
  });
  return opts.join('');
}

function getDueLabel(task) {
  if (!task.due_date) return '';
  if (task.due_date < today && task.status !== 'done') return `<span class="task-due overdue">Overdue · ${task.due_date}</span>`;
  if (task.due_date === today) return '<span class="task-due" style="color:#d97706;font-weight:600">Due today</span>';
  return `<span class="task-due">Due ${task.due_date}</span>`;
}

function isTodayCandidate(task) {
  if (!isOpen(task) || task.status === 'inbox') return false;
  if (isProject(task)) return false;
  const taskTags = tags(task);
  if (taskTags.includes('force-queue')) return false;
  if (taskTags.includes('force-today')) return true;
  if (task.scheduled_date === today) return true;
  if (task.due_date && task.due_date <= today) return true;
  return false;
}

function getInbox() {
  return allTasks
    .filter(task => task.status === 'inbox' && isTopLevel(task) && isOpen(task))
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

function getToday() {
  return allTasks.filter(isTodayCandidate).sort(compareTasks);
}

function getQueue() {
  const todayIds = new Set(getToday().map(task => task.id));
  return allTasks.filter(task => {
    if (!isTopLevel(task)) return false;
    if (task.status === 'inbox') return false;
    if (!showCompleted && !isOpen(task)) return false;
    if (todayIds.has(task.id)) return false;
    return [ITEM_KIND.PROJECT, ITEM_KIND.TASK, ITEM_KIND.REMINDER].includes(task._itemKind);
  }).sort(compareTasks);
}

function getCounts() {
  return { inbox: getInbox().length, today: getToday().length, queue: getQueue().length };
}

function getIntegrityIssues() {
  const issues = [];
  allTasks.forEach(task => {
    if (isProjectTask(task) && !task._projectId) {
      issues.push(`Project Task missing project: ${task.title}`);
    }
    if (isProjectTask(task) && task._projectId && !getTask(task._projectId)) {
      issues.push(`Project Task has missing parent project: ${task.title}`);
    }
    if (isProject(task) && !isTopLevel(task)) {
      issues.push(`Project nested under another item: ${task.title}`);
    }
  });
  return issues;
}

async function loadTasks() {
  const { data, error } = await sb.from('tasks').select('*').order('created_at', { ascending: false });
  if (error) {
    console.error(error);
    document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Could not load tasks.</div></div>';
    return;
  }
  allTasks = normalizeTasks(data || []);
  await loadSparkProjects();
  render();
}

async function loadSparkProjects() {
  const { data } = await sb.from('marketing_requests')
    .select('id,request_types,requester_email,status,created_at')
    .order('created_at', { ascending: false }).limit(20);
  sparkProjects = (data || []).filter(r => !['delivered', 'cancelled', 'archived', 'done'].includes(String(r.status || '').toLowerCase()));
}

function render() {
  renderSidebar();
  renderTopbar();
  renderContent();
}

function renderSidebar() {
  const counts = getCounts();
  const overdue = allTasks.filter(task => task.due_date && task.due_date < today && isOpen(task) && !isProject(task) && isTopLevel(task)).length;
  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-logo"><h1>ZERO ZERO TWO</h1><span>Task Manager · v${APP_VERSION}</span></div>
    <div class="nav-section">Views</div>
    ${VIEWS.map(view => `
      <div class="nav-item ${currentView === view.id ? 'active' : ''}" onclick="switchView('${view.id}')">
        ${view.icon} ${view.label}
        ${counts[view.id] > 0 ? `<span class="nav-badge ${view.id === 'today' ? '' : 'g'}">${counts[view.id]}</span>` : ''}
      </div>
    `).join('')}
    ${overdue > 0 ? `<div class="nav-item" style="color:var(--coral);" onclick="switchView('today')">⚠️ Overdue <span class="nav-badge">${overdue}</span></div>` : ''}
  `;
  document.getElementById('mobileTabs').innerHTML = VIEWS.map(view =>
    `<span class="tab ${currentView === view.id ? 'active' : ''}" onclick="switchView('${view.id}')">${view.icon} ${view.label}</span>`
  ).join('');
}

function renderTopbar() {
  const label = VIEWS.find(view => view.id === currentView)?.label || 'Tasks';
  const dateStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const issues = getIntegrityIssues();
  document.getElementById('topbar').innerHTML = `
    <h2>${label}</h2>
    <div class="topbar-right">
      <span class="topbar-date">${dateStr} · v${APP_VERSION}${issues.length ? ` · ${issues.length} model issue${issues.length === 1 ? '' : 's'}` : ''}</span>
      ${currentView === 'queue' ? `<button class="btn btn-outline" onclick="toggleCompletedVisibility()">${showCompleted ? 'Hide Done' : 'Show Done'}</button>` : ''}
      <button class="btn btn-primary" onclick="openAddModal()">+ Add Task</button>
    </div>
  `;
}

function renderIntegrityPanel() {
  const issues = getIntegrityIssues();
  if (!issues.length) return '';
  return `
    <div class="panel" style="border-color:#fecaca;background:#fff7f7;">
      <div class="panel-header"><h3>Model Integrity</h3><span class="panel-count">${issues.length}</span></div>
      <ul class="task-list">
        ${issues.map(issue => `<li class="task-item"><div class="task-body"><div class="task-title">${esc(issue)}</div></div></li>`).join('')}
      </ul>
    </div>
  `;
}

function renderContent() {
  let html = renderIntegrityPanel();

  if (currentView === 'today') {
    const items = getToday();
    if (!items.length) {
      document.getElementById('content').innerHTML = html + `<div class="panel"><div class="empty">🎯 Today is clear.</div></div>`;
      return;
    }

    const tasks = items.filter(task => task._itemKind === ITEM_KIND.TASK);
    const reminders = items.filter(task => task._itemKind === ITEM_KIND.REMINDER);
    const projectTasks = items.filter(task => task._itemKind === ITEM_KIND.PROJECT_TASK);

    html += renderSection('🎯 Tasks', tasks);
    html += renderSection('🔔 Reminders', reminders);
    html += renderProjectTaskTodaySection(projectTasks);
    document.getElementById('content').innerHTML = html;
    return;
  }

  if (currentView === 'queue') {
    const items = getQueue();
    if (!items.length) {
      document.getElementById('content').innerHTML = html + `<div class="panel"><div class="empty">📋 Queue is empty.</div></div>`;
      return;
    }

    const projects = items.filter(task => task._itemKind === ITEM_KIND.PROJECT);
    const tasks = items.filter(task => task._itemKind === ITEM_KIND.TASK);
    const reminders = items.filter(task => task._itemKind === ITEM_KIND.REMINDER);

    html += renderProjectCards(projects);
    html += renderSection('✅ Tasks', tasks);
    html += renderSection('🔔 Reminders', reminders);
    document.getElementById('content').innerHTML = html;
    return;
  }

  const items = getInbox();
  if (!items.length) {
    document.getElementById('content').innerHTML = html + `<div class="panel"><div class="empty">📥 Inbox clear — nothing to review.</div></div>`;
    return;
  }

  const projects = items.filter(task => task._itemKind === ITEM_KIND.PROJECT);
  const tasks = items.filter(task => task._itemKind === ITEM_KIND.TASK);
  const reminders = items.filter(task => task._itemKind === ITEM_KIND.REMINDER);

  html += renderProjectCards(projects);
  html += renderSection('📥 Tasks', tasks);
  html += renderSection('🔔 Reminders', reminders);
  document.getElementById('content').innerHTML = html;
}

function renderProjectCards(projects) {
  if (!projects.length) return '';
  return projects.map(project => {
    const projectTasks = projectTasksOf(project.id).sort((a, b) => {
      const aDone = a.status === 'done' ? 1 : 0;
      const bDone = b.status === 'done' ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      return compareTasks(a, b);
    });
    const done = projectTasks.filter(task => task.status === 'done').length;
    const total = projectTasks.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const todayProjectTaskIds = new Set(getToday().filter(task => task._projectId === project.id).map(task => task.id));

    return `
      <div class="project-card">
        <div class="project-header" onclick="openDetail('${project.id}')">
          <span class="project-icon">🔷</span>
          <span class="project-name">${esc(project.title)}</span>
          <span class="project-progress">${done}/${total}
            <span class="project-progress-bar"><span class="project-progress-fill" style="width:${pct}%"></span></span>
          </span>
          <span class="tag ${PRIO_TAG[project.priority] || PRIO_TAG.medium}">${project.priority || 'medium'}</span>
        </div>
        ${projectTasks.length ? `<div class="project-subtasks"><ul class="task-list">
          ${projectTasks.map(task => {
            const highlighted = todayProjectTaskIds.has(task.id);
            const muted = !highlighted && task.status !== 'done';
            return `<li class="task-item ${highlighted ? 'highlighted' : ''} ${muted ? 'not-today' : ''}">
              <div class="task-check ${task.status === 'done' ? 'done' : ''}" onclick="event.stopPropagation();toggleDone('${task.id}', ${task.status === 'done'})"></div>
              <div class="task-body" onclick="openDetail('${task.id}')" style="cursor:pointer">
                <div class="task-title ${task.status === 'done' ? 'struck' : ''}">${esc(task.title)}</div>
                ${getDueLabel(task)}
              </div>
            </li>`;
          }).join('')}
        </ul></div>` : `<div style="padding:12px 18px;color:var(--text-light);font-size:12px;">No Project Tasks yet. Open project to add one.</div>`}
      </div>
    `;
  }).join('');
}

function renderProjectTaskTodaySection(projectTasks) {
  if (!projectTasks.length) return '';
  const grouped = new Map();
  projectTasks.forEach(task => {
    const key = task._projectId || 'orphan';
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(task);
  });

  const cards = Array.from(grouped.entries()).map(([projectId, tasks]) => {
    const project = getTask(projectId);
    return `
      <div class="panel">
        <div class="panel-header">
          <h3>🧩 ${esc(project?.title || 'Missing Project')}</h3>
          <span class="panel-count">${tasks.length}</span>
        </div>
        <ul class="task-list">${tasks.sort(compareTasks).map(renderTaskItem).join('')}</ul>
      </div>
    `;
  });

  return cards.join('');
}

function renderSection(title, tasks) {
  if (!tasks.length) return '';
  return `
    <div class="panel">
      <div class="panel-header"><h3>${title}</h3><span class="panel-count">${tasks.length}</span></div>
      <ul class="task-list">${tasks.map(renderTaskItem).join('')}</ul>
    </div>
  `;
}

function renderTaskItem(task) {
  const isDone = task.status === 'done';
  const project = task._projectId ? getTask(task._projectId) : null;
  return `
    <li class="task-item">
      <div class="task-check ${isDone ? 'done' : ''}" onclick="event.stopPropagation();toggleDone('${task.id}', ${isDone})"></div>
      <div class="task-body" onclick="openDetail('${task.id}')" style="cursor:pointer">
        <div class="task-title ${isDone ? 'struck' : ''}">${esc(task.title)}</div>
        ${project ? `<div class="task-desc">🔷 ${esc(project.title)}</div>` : ''}
        ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
        <div class="task-meta">
          <span class="tag ${PRIO_TAG[task.priority] || PRIO_TAG.medium}">${task.priority || 'medium'}</span>
          ${TYPE_BADGE[task._itemKind] || TYPE_BADGE[ITEM_KIND.TASK]}
          ${task.source ? `<span class="tag tag-src">${SRC_ICON[task.source] || ''} ${task.source}</span>` : ''}
          ${getDueLabel(task)}
        </div>
      </div>
      ${task.estimated_minutes ? `<span class="task-est">~${task.estimated_minutes}m</span>` : ''}
    </li>
  `;
}

function switchView(viewId) {
  currentView = viewId;
  render();
}

function toggleCompletedVisibility() {
  showCompleted = !showCompleted;
  render();
}

async function patchTask(id, patch) {
  const { data, error } = await sb.from('tasks').update(patch).eq('id', id).select().single();
  if (error) {
    console.error(error);
    throw error;
  }
  const idx = allTasks.findIndex(task => task.id === id);
  if (idx >= 0) allTasks[idx] = normalizeTask(data);
  return allTasks[idx] || normalizeTask(data);
}

async function syncProjectCompletion(projectId) {
  if (!projectId) return;
  const project = getTask(projectId);
  if (!project || !isProject(project)) return;
  const projectTasks = projectTasksOf(projectId);
  if (!projectTasks.length) return;
  const allDone = projectTasks.every(task => task.status === 'done');
  if (allDone && project.status !== 'done') {
    await patchTask(projectId, { status: 'done', completed_at: new Date().toISOString() });
  }
  if (!allDone && project.status === 'done') {
    await patchTask(projectId, { status: 'active', completed_at: null });
  }
}

async function toggleDone(id, wasDone) {
  const task = getTask(id);
  if (!task) return;
  const newStatus = wasDone ? 'active' : 'done';
  const patch = { status: newStatus, completed_at: wasDone ? null : new Date().toISOString() };
  const updated = await patchTask(id, patch);
  await syncProjectCompletion(updated._projectId);
  render();
}

function getEditableType(task) {
  if (isProjectTask(task)) return ITEM_KIND.PROJECT_TASK;
  return task._itemKind;
}

function typeOptionsHtml(task) {
  const current = getEditableType(task);
  return [
    { value: ITEM_KIND.TASK, label: '✅ Task' },
    { value: ITEM_KIND.REMINDER, label: '🔔 Reminder' },
    { value: ITEM_KIND.PROJECT, label: '🔷 Project' },
    ...(isProjectTask(task) ? [{ value: ITEM_KIND.PROJECT_TASK, label: '🧩 Project Task' }] : []),
  ].map(option => `<option value="${option.value}" ${current === option.value ? 'selected' : ''}>${option.label}</option>`).join('');
}

function openDetail(id) {
  const task = getTask(id);
  if (!task) return;
  const project = task._projectId ? getTask(task._projectId) : null;
  const projectTasks = isProject(task) ? projectTasksOf(task.id) : [];

  document.getElementById('detailContent').innerHTML = `
    ${project ? `<div style="font-size:11px;color:var(--blue);margin-bottom:8px;">🔷 ${esc(project.title)}</div>` : ''}
    <div class="detail-field"><label>Title</label>
      <input value="${esc(task.title)}" onchange="updateField('${task.id}','title',this.value)" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:13px;font-weight:600;" />
    </div>
    <div class="detail-field"><label>Description</label>
      <textarea onchange="updateField('${task.id}','description',this.value)" style="width:100%;min-height:84px;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:12px;line-height:1.4;resize:vertical;">${esc(task.description || '')}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="detail-field"><label>Status</label>
        <select onchange="updateField('${task.id}','status',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
          ${['inbox', 'active', 'done', 'cancelled'].map(status => `<option value="${status}" ${task.status === status ? 'selected' : ''}>${status}</option>`).join('')}
        </select>
      </div>
      <div class="detail-field"><label>Priority</label>
        <select onchange="updateField('${task.id}','priority',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
          ${['critical', 'high', 'medium', 'low'].map(priority => `<option value="${priority}" ${task.priority === priority ? 'selected' : ''}>${priority}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="detail-field"><label>Type</label>
      <select onchange="updateType('${task.id}',this.value)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
        ${typeOptionsHtml(task)}
      </select>
    </div>
    ${!isProject(task) ? `<div class="detail-field"><label>Project</label>
      <select onchange="setParentProject('${task.id}', this.value || null)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;">
        ${projectOptionsHtml(task._projectId || '')}
      </select>
    </div>` : ''}
    <div class="detail-field"><label>Due Date</label>
      <input type="date" value="${task.due_date || ''}" onchange="updateField('${task.id}','due_date',this.value||null)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;" />
    </div>
    <div class="detail-field"><label>Scheduled Date</label>
      <input type="date" value="${task.scheduled_date || ''}" onchange="updateField('${task.id}','scheduled_date',this.value||null)" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);font-size:12px;" />
    </div>
    <div class="detail-field"><label>Notes</label>
      <textarea onchange="updateField('${task.id}','notes',this.value)" style="width:100%;min-height:80px;padding:8px;border-radius:6px;border:1px solid var(--border);font-family:inherit;font-size:12px;line-height:1.4;resize:vertical;">${esc(task.notes || '')}</textarea>
    </div>
    ${isProject(task) ? `
      <div class="detail-field"><label>Project Tasks (${projectTasks.filter(projectTask => projectTask.status === 'done').length}/${projectTasks.length})</label>
        <ul style="list-style:none;padding:0;">
          ${projectTasks.map(projectTask => `<li style="padding:4px 0;font-size:12px;${projectTask.status === 'done' ? 'text-decoration:line-through;color:var(--text-light);' : ''}">${projectTask.status === 'done' ? '✅' : '⬜'} ${esc(projectTask.title)}</li>`).join('')}
        </ul>
        <button class="btn btn-outline btn-sm" onclick="openAddProjectTask('${task.id}')" style="margin-top:8px;">+ Add Project Task</button>
      </div>
    ` : ''}
    <div class="detail-field"><label>Model</label>
      <div style="font-size:12px;line-height:1.5;">
        kind: <strong>${task._itemKind}</strong><br>
        project: ${task._projectId ? esc(project?.title || task._projectId) : 'none'}<br>
        parent_id: ${task.parent_id || 'null'}<br>
        depends_on: ${Array.isArray(task.depends_on) ? esc(task.depends_on.join(', ')) : (task.depends_on || 'null')}
      </div>
    </div>
    <div class="detail-field"><label>Created</label><div style="font-size:12px;">${new Date(task.created_at).toLocaleString()} by ${task.created_by || 'unknown'}</div></div>
    ${task.completed_at ? `<div class="detail-field"><label>Completed</label><div style="font-size:12px;">${new Date(task.completed_at).toLocaleString()}</div></div>` : ''}
    <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;">
      ${task.status !== 'done' ? `<button class="btn btn-primary btn-sm" onclick="toggleDone('${task.id}', false);closeDetail();">✓ Done</button>` : ''}
      <button class="btn btn-outline btn-sm" onclick="moveToToday('${task.id}')">→ Move to Today</button>
      <button class="btn btn-outline btn-sm" onclick="moveToQueue('${task.id}')">→ Queue</button>
      <button class="btn btn-outline btn-sm" style="color:var(--coral);" onclick="deleteTask('${task.id}')">🗑</button>
    </div>
  `;
  document.getElementById('detailPanel').classList.add('show');
  document.getElementById('detailOverlay').classList.add('show');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  document.getElementById('detailOverlay').classList.remove('show');
}

async function moveToToday(id) {
  const task = getTask(id);
  if (!task) return;
  let nextTags = rawTags(task).filter(tag => !['force-queue', 'force-today'].includes(String(tag).toLowerCase()));
  nextTags.push('force-today');
  await patchTask(id, { tags: nextTags, scheduled_date: today, status: task.status === 'inbox' ? 'active' : task.status });
  render();
  closeDetail();
}

async function moveToQueue(id) {
  const task = getTask(id);
  if (!task) return;
  let nextTags = rawTags(task).filter(tag => !['force-today', 'force-queue'].includes(String(tag).toLowerCase()));
  nextTags.push('force-queue');
  await patchTask(id, { tags: nextTags, scheduled_date: null, status: task.status === 'inbox' ? 'active' : task.status });
  render();
  closeDetail();
}

function buildTagsForKind(task, nextKind) {
  const preserved = rawTags(task).filter(tag => {
    const lower = String(tag).toLowerCase();
    if (lower.startsWith(MODEL_KIND_PREFIX)) return false;
    if (lower === 'project' || lower === 'reminder') return false;
    return true;
  });
  if (nextKind === ITEM_KIND.PROJECT) preserved.push('project');
  if (nextKind === ITEM_KIND.REMINDER) preserved.push('reminder');
  preserved.push(`${MODEL_KIND_PREFIX}${nextKind}`);
  return preserved;
}

async function updateType(id, typeValue) {
  const task = getTask(id);
  if (!task) return;
  if (typeValue === ITEM_KIND.PROJECT_TASK && !task._projectId) {
    alert('Assign this item to a project before marking it as a Project Task.');
    openDetail(id);
    return;
  }
  if (typeValue === ITEM_KIND.PROJECT && task._projectId) {
    await setParentProject(id, null, { skipReopen: true });
  }
  await patchTask(id, { tags: buildTagsForKind(task, typeValue) });
  render();
  openDetail(id);
}

async function setParentProject(taskId, projectId, options = {}) {
  const task = getTask(taskId);
  if (!task) return;
  if (projectId === taskId) {
    alert('An item cannot belong to itself.');
    return;
  }
  const currentKind = projectId ? ITEM_KIND.PROJECT_TASK : (isReminder(task) ? ITEM_KIND.REMINDER : ITEM_KIND.TASK);
  const patch = {
    parent_id: projectId,
    depends_on: projectId ? [projectId] : null,
    tags: buildTagsForKind(task, currentKind),
    status: task.status === 'inbox' && projectId ? 'active' : task.status,
  };
  await patchTask(taskId, patch);
  await syncProjectCompletion(projectId);
  if (task._projectId && task._projectId !== projectId) await syncProjectCompletion(task._projectId);
  render();
  if (!options.skipReopen) openDetail(taskId);
}

async function updateField(id, field, value) {
  const task = getTask(id);
  if (!task) return;
  if (field === 'title' && !String(value || '').trim()) {
    alert('Title cannot be empty');
    return;
  }
  const patch = { [field]: field === 'title' ? String(value).trim() : value };
  if (field === 'status') patch.completed_at = value === 'done' ? new Date().toISOString() : null;
  const updated = await patchTask(id, patch);
  await syncProjectCompletion(updated._projectId);
  render();
}

async function deleteTask(id) {
  const task = getTask(id);
  if (!task) return;
  if (!confirm('Delete this task?')) return;
  const parentProjectId = task._projectId;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) {
    console.error(error);
    return;
  }
  allTasks = allTasks.filter(existing => existing.id !== id);
  await syncProjectCompletion(parentProjectId);
  closeDetail();
  render();
}

function openAddModal() {
  const projectSelect = document.getElementById('newParentProject');
  if (projectSelect) projectSelect.innerHTML = projectOptionsHtml('');
  document.getElementById('addModal').classList.add('show');
  document.getElementById('newTitle').focus();
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
}

async function addTask() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;

  const typeValue = document.getElementById('newType').value;
  const projectId = document.getElementById('newParentProject').value || null;
  const effectiveKind = projectId ? ITEM_KIND.PROJECT_TASK : typeValue;
  const task = {
    title,
    description: document.getElementById('newDesc').value.trim() || null,
    priority: document.getElementById('newPriority').value,
    category: 'business',
    due_date: document.getElementById('newDue').value || null,
    status: projectId ? 'active' : 'inbox',
    source: 'manual',
    assigned_to: 'neil',
    created_by: 'neil',
    tags: buildTagsForKind({ tags: [] }, effectiveKind),
    parent_id: projectId,
    depends_on: projectId ? [projectId] : null,
  };

  const { data, error } = await sb.from('tasks').insert(task).select().single();
  if (error) {
    console.error(error);
    alert('Error adding task');
    return;
  }

  allTasks.unshift(normalizeTask(data));
  await syncProjectCompletion(projectId);
  closeAddModal();
  document.getElementById('newTitle').value = '';
  document.getElementById('newDesc').value = '';
  document.getElementById('newDue').value = '';
  document.getElementById('newParentProject').value = '';
  render();
}

function openAddProjectTask(projectId) {
  closeDetail();
  const title = prompt('Project Task title:');
  if (!title || !title.trim()) return;
  addProjectTask(projectId, title.trim());
}

async function addProjectTask(projectId, title) {
  const project = getTask(projectId);
  const task = {
    title,
    priority: project?.priority || 'medium',
    category: project?.category || 'business',
    status: 'active',
    source: 'manual',
    assigned_to: 'neil',
    created_by: 'neil',
    tags: buildTagsForKind({ tags: [] }, ITEM_KIND.PROJECT_TASK),
    parent_id: projectId,
    depends_on: [projectId],
  };

  const { data, error } = await sb.from('tasks').insert(task).select().single();
  if (error) {
    console.error(error);
    return;
  }

  allTasks.unshift(normalizeTask(data));
  await syncProjectCompletion(projectId);
  render();
  openDetail(projectId);
}

function esc(value) {
  if (value == null) return '';
  const div = document.createElement('div');
  div.textContent = String(value);
  return div.innerHTML;
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closeAddModal();
    closeDetail();
  }
  if (event.key === 'n' && !event.metaKey && !event.ctrlKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    event.preventDefault();
    openAddModal();
  }
});

window.taskModelDebug = {
  version: APP_VERSION,
  getTasks: () => allTasks,
  getIntegrityIssues,
};

loadTasks();
setInterval(loadTasks, 60000);

</script>
</body>
</html>
